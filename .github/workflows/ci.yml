name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# 同じ PR / ブランチへの連続 push では最新のコミットだけをビルドする。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release)
    # VRCToolsDataSync.App が WinUI 3 と Windows App SDK に依存しているため、
    # Linux ランナーではビルドできない。
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # README のセットアップ手順そのもの。ここが通らないと、利用者は書いてある
      # とおりの手順でビルドできない (issue #28)。プロジェクト単位のビルドだけを
      # 見ていると、solution 経由でしか出ない不整合を取りこぼす。
      - name: Build solution
        # 警告をエラー扱いにするかは既存コードの警告状況を見てから決める (issue #25)。
        run: dotnet build VRCToolsDataSync.slnx --configuration Release

      # solution のビルドが通った後に走らせる。ビルドは通るが振る舞いが壊れている、
      # という状態を CI で捕まえる手段がここまで無かった (issue #38)。
      # solution ではなくテストプロジェクトを直接指す。solution 経由だと App の
      # Platform 割り当てと WinUI のワークロードまで巻き込むため、テストの成否と
      # 関係の無いところで落ちうる。
      - name: Test
        run: dotnet test tests/VRCToolsDataSync.Core.Tests/VRCToolsDataSync.Core.Tests.csproj --configuration Release

      # リリースと同じ形 (RID と Platform を明示) でも通ることを確かめる。
      # solution 経由では Platform が slnx の割り当てで決まるため、こちらは
      # release.yml の publish に近い経路の確認になる。
      - name: Build App (win-x64)
        run: dotnet build src/VRCToolsDataSync.App/VRCToolsDataSync.App.csproj --configuration Release --runtime win-x64 -p:Platform=x64
