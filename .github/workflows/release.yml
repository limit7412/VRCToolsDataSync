name: release

# 安定版リリースの作成と、成果物の添付を担う。
# master への push を契機とするプレリリースの自動作成は prerelease.yml が担う (issue #45)。
# 以前は master への push ごとにパッチを自動採番した安定版を公開していたが、
# チャンネル分岐により test チャンネルのプレリリースへ移した。
#
# タグ push と手動実行は Draft リリースを作り、リリースの手動作成 (release: created) は
# そのリリースへ成果物を添付する。
#
# バージョンはビルドの前に決めて publish へ渡す。成果物が自分の版を知らないと、
# 自動アップデートの「実行中の版と最新版の比較」が組めないためである。
# どの契機でもタグは決まっているため、採番の直列化は要らない。

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースを作成するタグ名 (空ならアーティファクトのみ)'
        required: false

permissions:
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      # リリースとタグの操作にはタグ名をそのまま使う
      name: ${{ steps.tag.outputs.name }}
      # 成果物へ埋め込む版。タグに v を付ける運用へ変わっても読めるよう、先頭の v を落とす
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Determine tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            name="$RELEASE_TAG"
          elif [ "${{ github.event_name }}" = "push" ]; then
            name="$REF_NAME"
          else
            # 手動実行でタグを渡さなかった場合は空のままにする。
            # リリースは作らず、版の埋め込みも行わないアーティファクトだけを残す。
            name="$INPUT_TAG"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=${name#v}" >> "$GITHUB_OUTPUT"
          echo "タグ: ${name:-(なし)}"

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore VRCToolsDataSync.slnx

      - name: Publish (App + Cli, ${{ matrix.arch }})
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # 版が空でもそのまま渡す。build-release.ps1 が空の版を「埋め込まない」と扱う
        run: ./scripts/build-release.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRCToolsDataSync-win-${{ matrix.arch }}
          path: artifacts/VRCToolsDataSync-win-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, build]
    if: needs.version.outputs.name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.version.outputs.name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to existing release
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.version.outputs.name }}
        run: gh release upload "$TAG_NAME" artifacts/*.zip --clobber

      # タグが無ければこのアクションが github.sha に対して作る。
      # ここへ来るのはタグ push とタグ付きの手動実行だけであり、公開は人が行うため
      # Draft で作る。
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.name }}
          draft: true
          generate_release_notes: true
          files: artifacts/*.zip
